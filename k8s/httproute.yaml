apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sre-demo
  namespace: sre-lab
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - sre.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sre-demo
          port: 80
