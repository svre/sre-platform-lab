deployment:
  kind: Deployment
  replicas: 1

nodeSelector:
  ingress-ready: "true"

service:
  spec:
    type: ClusterIP

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

ingressClass:
  enabled: false

gatewayClass:
  enabled: true
  name: traefik

gateway:
  enabled: true
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All

    websecure:
      port: 8443
      hostname: sre.localhost
      protocol: HTTPS
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - group: ""
          kind: Secret
          name: sre-localhost-tls

accessLog:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
